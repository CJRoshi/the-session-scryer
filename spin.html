  <style>
    /* Typostuck */
    @font-face {
      font-family: 'Typostuck';
      src: url('./fonts/TYPOSTUCK.ttf') format('truetype');
      font-display: swap;
    }
    /* Fullscreen dark arena. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0a0a; color: #e6e6e6;
      font-family: 'Courier New', monospace;
    }
    #root { width: 100%; height: 100%; }
    .nkp-page {
      position: relative;
      width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(30,30,60,0.55), transparent 60%),
        #0a0a0a;
    }
    /* Arena — subtle rounded box that visually anchors the collision
       bounds. The physics uses the same rect. `overflow: hidden` clips
       glyphs at the border so cameo-mode bodies drifting off-arena get
       cut off cleanly by the dark exterior instead of floating naked
       over the page background. */
    .nkp-arena {
      position: absolute;
      background: rgba(20,20,30,0.55);
      border: 1px solid rgba(120,140,200,0.35);
      border-radius: 14px;
      overflow: hidden;
      box-shadow:
        0 0 40px rgba(80,110,200,0.15) inset,
        0 0 60px rgba(0,0,0,0.6);
    }
    /* Back button — mirrors scry.html's .abscond-btn so returning to
       the Scryer feels like the same brand language, not a new UI. */
    .nkp-abscond {
      position: absolute;
      top: 18px; left: 20px;
      z-index: 10;
      padding: 8px 18px;
      background: transparent;
      border: 1px solid rgba(180, 200, 240, 0.45);
      border-radius: 4px;
      color: #b8c8e8;
      font-family: 'Typostuck', 'Courier New', monospace;
      font-size: 16px;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.15s, color 0.15s, border-color 0.15s;

    .nkp-abscond:hover {
      background: rgba(80, 130, 240, 0.12);
      color: #f4f8ff;
      border-color: rgba(180, 200, 240, 0.85);

    .nkp-title-row {

<div id="root"></div>

<!-- Session data-layer scripts (same load order as scry.html) -->

<!-- Glyph renderer -->
<script type="text/babel" src="./components/classpect-glyph.js"></script>

<script type="text/babel">
/* ================================================================
   NAGASAKY KIKKY PARK

   Each glyph is a circular rigid body with:
     - linear state: position (x,y) + velocity (vx,vy)
     - angular state: theta + omega  (fed straight into
       ClasspectGlyph via the new `spinAngle` prop, so the ring layer
       rotates in place while the aspect symbol stays static)

   Collisions:
     - Wall hits reflect the normal component of velocity AND kick
       omega by the tangential contact velocity so bouncing off a
       wall spins the glyph up or down like a real beyblade rim-
       striking the arena.
     - Body-body hits swap the normal component of linear velocity
       between the two (equal-mass elastic) and trade omega toward
       each other along the tangent (angular momentum exchange).

   No damping — perpetual motion feels correct for the beyblade
   metaphor and the loop stays cheap.
   ================================================================ */

// Physics knobs. Sizing is DERIVED from arena area + member count
// (see nkpGlyphSize below) so fewer bodies get bigger, filling the
// arena rather than looking like tiny confetti in a huge box.
/* Layout knobs are viewport-derived (see nkpLayout below). Desktop
   gets generous padding + big glyph range; mobile drops all four to
   fit the smaller canvas. Phone viewports otherwise ended up with a
   near-full-screen header and glyph min > 1/3 of the arena width. */
const NKP_MOBILE_BREAKPOINT   = 640; // viewport px below this → mobile tuning
function nkpLayout(viewportW, memberCount) {
  const mobile = viewportW < NKP_MOBILE_BREAKPOINT;
  // Density tiers — huge sessions (HSOD's 90+ member roster on a
  // portrait phone, for example) get their glyph floor + pack fraction
  // scaled down so bodies stop overlapping the whole arena.
  const veryLarge = memberCount >= 60;
  const large     = memberCount >= 30;
  const sizeMin =
    mobile ? (veryLarge ? 28 : large ? 40 : 48)
           : (veryLarge ? 52 : large ? 68 : 80);
  const packFrac =
    mobile ? (veryLarge ? 0.20 : large ? 0.24 : 0.28)
           : (veryLarge ? 0.18 : large ? 0.20 : 0.22);
  return {
    padSides: mobile ? 12 : 40,   // arena inset left/right/bottom
    padTop:   mobile ? 64 : 90,   // arena inset top (clears the header)
    sizeMin,
    sizeMax: mobile ? 180 : 340,  // glyph ceiling
    packFrac,
  };
}
const NKP_SIZE_JITTER         = 0.15; // ±15% per-glyph size variation
const NKP_INITIAL_SPEED       = 220;  // px/s max initial linear speed
const NKP_INITIAL_OMEGA_MAX   = 360;  // deg/s max initial angular speed
const NKP_WALL_SPIN_KICK      = 1.6;  // deg-per-px-tangential on wall hit
const NKP_COLLIDE_SPIN_XFER   = 0.6;  // fraction of tangential contact
                                      // velocity converted to Δomega on
                                      // body-body collision

/* Cameo mode — for huge sessions (HSOD's 300+ member roster) we
   physicalize only NKP_CAMEO_ACTIVE bodies at a time and cycle
   through the rest. Walls become permeable: when a body drifts
   past the arena bounds it's removed, its player pushed to the
   back of a shuffled waiting queue, and the next queued player
   spawns on the OPPOSITE edge with an inward velocity — creating
   the illusion of a continuous roster while keeping physics /
   render cost bounded. Threshold matches the 168-classpect
   ceiling (+1) so anything larger than "one of each" trips it. */
const NKP_CAMEO_THRESHOLD     = 169;
const NKP_CAMEO_ACTIVE        = 100;
const NKP_CAMEO_ENTRY_SPEED   = 200;  // px/s inward on re-entry
const NKP_CAMEO_EXIT_BUFFER   = 6;    // extra px past the wall before
                                      // a body is considered "gone"

/* Grab-and-fling knobs. `SPIN_CURL_FACTOR` maps the rotation rate of
   the mouse velocity vector to Δomega — so a straight drag imparts
   linear speed only, but a circular wiggle (velocity vector rotates)
   spins the classpect up. Small-movement
   threshold filters out shaky-hand noise. */
const NKP_HELD_MIN_SPEED      = 40;   // px/s below which we skip spin math
const NKP_HELD_SPIN_FACTOR    = 0.55; // Δvel-angle (rad/s) → deg/s omega
                                      // scale — tune for how much a
                                      // wrist-flick winds a body up.
const NKP_HELD_VEL_SMOOTH     = 0.5;  // 0 = no smoothing, 1 = frozen.
const NKP_HELD_OMEGA_SMOOTH   = 0.7;  // heavier smoothing for spin so
                                      // wobbly draws don't chatter.

/* Base glyph radius sized so the total glyph area covers roughly
   packFrac of the arena. Solved from
     N × π × r²  =  packFrac × W × H
   Then clamped between the viewport-derived size floor / ceiling. */
function nkpBaseSize(n, arenaW, arenaH, layout) {
  if (n <= 0) return layout.sizeMin;
  const targetR = Math.sqrt(layout.packFrac * arenaW * arenaH / (n * Math.PI));
  const size = 2 * targetR;
  return Math.max(layout.sizeMin, Math.min(layout.sizeMax, size));
}

/* Decode the session out of the URL hash. Same hash format that
   scry.html uses, so users can hop back and forth freely. */
function nkpDecodeSessionFromHash() {
  const raw = decodeURIComponent((window.location.hash || '').replace(/^#/, ''));
  if (!raw) return { code: '', players: [] };
  // Try alias first (canonical / cherubs / etc.), then raw code.
  const alias = (typeof specialSessionByAlias === 'function')
    ? specialSessionByAlias(raw) : null;
  const code = alias ? alias.code : raw;
  const result = (typeof decodeSession === 'function') ? decodeSession(code) : { players: [] };
  return { code: raw, players: result.players || [] };
}

/* Monotonically-increasing body ID — used as the React key and as
   the handle the mouse-grab code uses to survive array reshuffles
   in cameo mode (where bodies come and go every second or two). */
let _nkpBodyIdSeq = 0;

/* Build one physics body for `p`. Position + velocity are randomized
   inside the arena; omega picks up the canonical class rotation
   direction (Active classes spin one way, Passive the other) so the
   arena starts with a mostly-plausible mix of spin senses. */
function nkpMakeBody(p, arenaW, arenaH, layout, base) {
  // Per-glyph jitter around the base size so bodies don't all look
  // uniform.
  const jitter = 1 + (Math.random() * 2 - 1) * NKP_SIZE_JITTER;
  const size = Math.max(layout.sizeMin, base * jitter);
  const r = size / 2;
  const x = r + Math.random() * Math.max(1, arenaW - 2 * r);
  const y = r + Math.random() * Math.max(1, arenaH - 2 * r);
  const angle = Math.random() * Math.PI * 2;
  const speed = NKP_INITIAL_SPEED * (0.4 + Math.random() * 0.6);
  const sign = (typeof classesNumeric !== 'undefined' && classesNumeric[p.class])
               ? classesNumeric[p.class] : -1;
  const spinDir = sign < 0 ? 1 : -1;
  return {
    id: _nkpBodyIdSeq++,
    player: p,
    size, r, x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    theta: Math.random() * 360,
    omega: spinDir * (60 + Math.random() * NKP_INITIAL_OMEGA_MAX),
  };
}

/* Cameo-mode replacement — build a body for `p` and reposition it
   just off-arena on the OPPOSITE edge of where `exited` left,
   pointing inward. Small perpendicular jitter avoids a stiff
   conveyor-belt look. */
function nkpSpawnFromEdge(p, exited, arenaW, arenaH, layout, base) {
  const b = nkpMakeBody(p, arenaW, arenaH, layout, base);
  const r = b.r;
  // Which wall did `exited` go through? Ties broken toward the larger
  // overshoot so diagonal exits pick the dominant axis.
  const overLeft   = -(exited.x + exited.r);
  const overRight  =  (exited.x - exited.r) - arenaW;
  const overTop    = -(exited.y + exited.r);
  const overBottom =  (exited.y - exited.r) - arenaH;
  const worst = Math.max(overLeft, overRight, overTop, overBottom);
  const jit = () => (Math.random() - 0.5) * NKP_CAMEO_ENTRY_SPEED * 0.5;
  if (worst === overLeft) {
    b.x = arenaW + r;
    b.y = Math.max(r, Math.min(arenaH - r, exited.y));
    b.vx = -NKP_CAMEO_ENTRY_SPEED; b.vy = jit();
  } else if (worst === overRight) {
    b.x = -r;
    b.y = Math.max(r, Math.min(arenaH - r, exited.y));
    b.vx =  NKP_CAMEO_ENTRY_SPEED; b.vy = jit();
  } else if (worst === overTop) {
    b.y = arenaH + r;
    b.x = Math.max(r, Math.min(arenaW - r, exited.x));
    b.vy = -NKP_CAMEO_ENTRY_SPEED; b.vx = jit();
  } else {
    b.y = -r;
    b.x = Math.max(r, Math.min(arenaW - r, exited.x));
    b.vy =  NKP_CAMEO_ENTRY_SPEED; b.vx = jit();
  }
  return b;
}

/* In-place Fisher–Yates shuffle. Used once at session start to
   randomize the cameo waiting queue. */
function nkpShuffleInPlace(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* Build the initial body set. For normal sessions: one body per
   player. For cameo sessions (>= NKP_CAMEO_THRESHOLD players):
   physicalize the first NKP_CAMEO_ACTIVE from a shuffled roster
   and return the remainder as the waiting queue. */
function nkpBuildInitial(players, arenaW, arenaH, layout, cameo) {
  const base = nkpBaseSize(cameo ? NKP_CAMEO_ACTIVE : players.length,
                           arenaW, arenaH, layout);
  if (!cameo) {
    return { bodies: players.map(p => nkpMakeBody(p, arenaW, arenaH, layout, base)),
             waiting: [], base };
  }
  const shuffled = nkpShuffleInPlace(players.slice());
  const active   = shuffled.slice(0, NKP_CAMEO_ACTIVE);
  const waiting  = shuffled.slice(NKP_CAMEO_ACTIVE);
  return { bodies: active.map(p => nkpMakeBody(p, arenaW, arenaH, layout, base)),
           waiting, base };
}

/* Body-body elastic collision along the line of centers, plus a
   tangential-velocity → omega transfer so spinning bodies "grab"
   each other on impact like beyblade tips catching. */
function nkpResolvePair(a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const dist2 = dx * dx + dy * dy;
  const minDist = a.r + b.r;
  if (dist2 >= minDist * minDist) return;
  const dist = Math.sqrt(dist2) || 0.0001;

  // Push them apart so they don't stay overlapped next frame.
  const overlap = minDist - dist;
  const nx = dx / dist, ny = dy / dist;
  const push = overlap / 2;
  a.x -= nx * push; a.y -= ny * push;
  b.x += nx * push; b.y += ny * push;

  // Relative velocity component along the normal.
  const rvx = b.vx - a.vx;
  const rvy = b.vy - a.vy;
  const vAlongNormal = rvx * nx + rvy * ny;
  if (vAlongNormal > 0) return;  // already separating

  // Equal-mass 1D elastic exchange along the normal.
  const jx = vAlongNormal * nx;
  const jy = vAlongNormal * ny;
  a.vx += jx; a.vy += jy;
  b.vx -= jx; b.vy -= jy;

  // Angular momentum trade — tangential component of the contact
  // velocity, split between the two bodies with opposite signs so
  // a fast-spinner-hitting-a-slow-spinner speeds the slow one up
  // and drags the fast one down.
  const tx = -ny, ty = nx;
  const relTangent = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty;
  const spinDelta = NKP_COLLIDE_SPIN_XFER * relTangent;
  a.omega += spinDelta;
  b.omega -= spinDelta;
}

/* React shell — measures the viewport once at mount, builds bodies,
   runs the physics loop, and renders one glyph per body. */
const NkpApp = () => {
  const [decoded] = React.useState(() => nkpDecodeSessionFromHash());
  const [viewport, setViewport] = React.useState(() => ({
    w: window.innerWidth, h: window.innerHeight,
  }));
  React.useEffect(() => {
    // Debounced resize handler.
    let raf = null;
    const onResize = () => {
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        setViewport({ w: window.innerWidth, h: window.innerHeight });
        raf = null;
      });
    };
    window.addEventListener('resize',            onResize);
    window.addEventListener('orientationchange', onResize);
    return () => {
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener('resize',            onResize);
      window.removeEventListener('orientationchange', onResize);
    };
  }, []);

  // Cameo mode kicks in once the roster crosses the 168-classpect
  // ceiling. In that mode the effective on-screen count is capped at
  // NKP_CAMEO_ACTIVE, so layout sizes for THAT count .
  const cameoMode = decoded.players.length >= NKP_CAMEO_THRESHOLD;
  const effectiveCount = cameoMode
    ? Math.min(NKP_CAMEO_ACTIVE, decoded.players.length)
    : decoded.players.length;
  const layout = nkpLayout(viewport.w, effectiveCount);
  const arenaX = layout.padSides;
  const arenaY = layout.padTop;
  const arenaW = Math.max(180, viewport.w - layout.padSides * 2);
  const arenaH = Math.max(180, viewport.h - layout.padTop - layout.padSides);

  // Bodies live in a ref so the RAF loop can mutate them without
  // triggering React rerenders per frame. A separate `tick` state
  // increments each frame to drive rerender of the visual layer.
  const bodiesRef = React.useRef([]);
  // Cameo-mode waiting queue — players not currently on-arena.
  // Populated once at build time; mutated FIFO as bodies cycle in
  // and out. `baseRef` caches the target glyph size so newcomers
  // match the existing on-arena bodies rather than resampling.
  const waitingRef = React.useRef([]);
  const baseRef    = React.useRef(0);
  // Held-body state: which body the mouse currently owns (by id,
  // not array index — cameo mode shuffles the array constantly),
  // plus running velocity/omega samples so releasing hands the
  // physics loop plausible momentum from the last few frames.
  const heldRef = React.useRef(null);
  const arenaRef = React.useRef(null);
  // Mirror arena dims into a ref so the always-on mouse handlers can
  // clamp the held body to the current bounds without their effect
  // needing to re-subscribe every resize.
  const arenaSizeRef = React.useRef({ w: arenaW, h: arenaH });
  React.useEffect(() => { arenaSizeRef.current = { w: arenaW, h: arenaH }; }, [arenaW, arenaH]);
  const [, setTick] = React.useState(0);
  React.useEffect(() => {
    if (!decoded.players.length) return;
    const init = nkpBuildInitial(decoded.players, arenaW, arenaH, layout, cameoMode);
    bodiesRef.current  = init.bodies;
    waitingRef.current = init.waiting;
    baseRef.current    = init.base;
    let raf = 0;
    let last = performance.now();
    const step = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);  // cap 50ms so alt-tab freezes don't teleport bodies
      last = now;
      const bs = bodiesRef.current;
      // Collect cameo-mode exits so we can splice them out AFTER the
      // integration loop (avoids mutating `bs` mid-iteration).
      const exitedIdxs = [];
      for (let i = 0; i < bs.length; i++) {
        const b = bs[i];
        // Held bodies skip physics integration — their position is
        // driven by mousemove instead. Theta still ticks so users see
        // their wind-up-spin build while dragging.
        if (b.held) {
          b.theta = (b.theta + b.omega * dt) % 360;
          continue;
        }
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.theta = (b.theta + b.omega * dt) % 360;
        if (cameoMode) {
          // Walls are permeable in cameo mode: bodies drift out and
          // get swapped for a queued player entering the opposite
          // edge. Consider "gone" once fully past the wall by r + a
          // small buffer.
          const gone = (b.x + b.r + NKP_CAMEO_EXIT_BUFFER < 0)
                    || (b.x - b.r - NKP_CAMEO_EXIT_BUFFER > arenaW)
                    || (b.y + b.r + NKP_CAMEO_EXIT_BUFFER < 0)
                    || (b.y - b.r - NKP_CAMEO_EXIT_BUFFER > arenaH);
          // Never cycle out a body the user is currently dragging —
          // that would yank it out of their hand mid-fling.
          if (gone && !b.held) exitedIdxs.push(i);
        } else {
          // Wall bounces + tangential spin-kick. The tangential vel
          // at the contact point is a mix of the body's linear velocity
          // along the wall and its rim velocity due to omega — for a
          // beyblade spinning a wheel against a wall, that's what spins
          // it up or down. Simplified to just the linear-tangent term.
          if (b.x - b.r < 0)          { b.x = b.r;          b.vx = Math.abs(b.vx);  b.omega += NKP_WALL_SPIN_KICK *  b.vy; }
          if (b.x + b.r > arenaW)     { b.x = arenaW - b.r; b.vx = -Math.abs(b.vx); b.omega += NKP_WALL_SPIN_KICK * -b.vy; }
          if (b.y - b.r < 0)          { b.y = b.r;          b.vy = Math.abs(b.vy);  b.omega += NKP_WALL_SPIN_KICK * -b.vx; }
          if (b.y + b.r > arenaH)     { b.y = arenaH - b.r; b.vy = -Math.abs(b.vy); b.omega += NKP_WALL_SPIN_KICK *  b.vx; }
        }
      }
      // Cameo cycling — for each exit, push its player to the back
      // of the waiting queue and spawn the next queued player on
      // the opposite edge. Iterate exitedIdxs in DESCENDING order so
      // splice() indices stay valid.
      if (cameoMode && exitedIdxs.length) {
        for (let k = exitedIdxs.length - 1; k >= 0; k--) {
          const idx = exitedIdxs[k];
          const exited = bs[idx];
          bs.splice(idx, 1);
          waitingRef.current.push(exited.player);
          const nextPlayer = waitingRef.current.shift();
          if (nextPlayer) {
            const nb = nkpSpawnFromEdge(nextPlayer, exited,
                                        arenaW, arenaH, layout, baseRef.current);
            bs.push(nb);
          }
        }
      }
      // Pairwise collisions. O(n²) — bounded by 100 in cameo mode,
      // 20-ish typical otherwise.
      for (let i = 0; i < bs.length; i++) {
        for (let j = i + 1; j < bs.length; j++) nkpResolvePair(bs[i], bs[j]);
      }
      setTick(t => (t + 1) & 0xffffff);
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
    // Only rebuild when the DECODED player set or arena dimensions
    // meaningfully change — resize should keep momentum, so we key
    // on player count + arena size.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [decoded.players.length, arenaW, arenaH, cameoMode]);

  // Mouse handling — grab-and-fling. Attaches ONCE per mount; reads
  // arena rect via arenaRef every event (always fresh) and clamps to
  // arenaSizeRef so resize is picked up automatically. Uses window-
  // level move/up so dragging can leave the arena without losing the
  // grab (matches OS drag semantics).
  React.useEffect(() => {
    const eventPoint = (e) => {
      // Support touch events too — same finger, same drag semantics.
      const src = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
      const rect = arenaRef.current && arenaRef.current.getBoundingClientRect();
      if (!rect) return null;
      return { x: src.clientX - rect.left, y: src.clientY - rect.top };
    };
    const findBodyAt = (mx, my) => {
      const bs = bodiesRef.current;
      // Iterate topmost-first (last in array renders last / on top).
      for (let i = bs.length - 1; i >= 0; i--) {
        const b = bs[i];
        const dx = mx - b.x, dy = my - b.y;
        if (dx * dx + dy * dy < b.r * b.r) return b;
      }
      return null;
    };
    // Body-by-id lookup. Cameo mode splices bodies in and out of the
    // array every second or two, so a stale integer index is
    // dangerous — the id is stable across cycles.
    const bodyById = (id) => {
      const bs = bodiesRef.current;
      for (let i = 0; i < bs.length; i++) if (bs[i].id === id) return bs[i];
      return null;
    };
    const onDown = (e) => {
      const p = eventPoint(e);
      if (!p) return;
      const b = findBodyAt(p.x, p.y);
      if (!b) return;
      b.held = true;
      // Kill existing motion so the grab feels crisp — release will
      // hand back fresh momentum computed from the drag itself.
      b.vx = 0; b.vy = 0; b.omega = 0;
      heldRef.current = {
        bodyId: b.id,
        offsetX: p.x - b.x,
        offsetY: p.y - b.y,
        lastX: p.x, lastY: p.y,
        lastTime: performance.now(),
        smVX: 0, smVY: 0, smOmega: 0,
        prevVelAngle: null,
      };
      e.preventDefault();
    };
    const onMove = (e) => {
      const h = heldRef.current;
      if (!h) return;
      const p = eventPoint(e);
      if (!p) return;
      const b = bodyById(h.bodyId);
      if (!b) { heldRef.current = null; return; }
      const now = performance.now();
      const dt = Math.max(0.001, (now - h.lastTime) / 1000);
      // Raw cursor velocity (px/s).
      const rawVX = (p.x - h.lastX) / dt;
      const rawVY = (p.y - h.lastY) / dt;
      const speed = Math.hypot(rawVX, rawVY);
      // Snap body to cursor (offset preserved), clamped to arena so
      // you can't drag a body off-screen.
      const size = arenaSizeRef.current;
      const nextX = Math.max(b.r, Math.min(size.w - b.r, p.x - h.offsetX));
      const nextY = Math.max(b.r, Math.min(size.h - b.r, p.y - h.offsetY));
      b.x = nextX; b.y = nextY;
      // Exponentially-smoothed velocity — a single frame of noise
      // doesn't dominate the release throw.
      h.smVX = h.smVX * NKP_HELD_VEL_SMOOTH + rawVX * (1 - NKP_HELD_VEL_SMOOTH);
      h.smVY = h.smVY * NKP_HELD_VEL_SMOOTH + rawVY * (1 - NKP_HELD_VEL_SMOOTH);
      // Spin from CURL of the cursor path — velocity vector rotation
      // rate. Straight drags don't spin (velocity direction constant);
      // circular wiggles do (velocity direction sweeps around).
      if (speed > NKP_HELD_MIN_SPEED) {
        const vAngle = Math.atan2(rawVY, rawVX);
        if (h.prevVelAngle !== null) {
          let dA = vAngle - h.prevVelAngle;
          if (dA > Math.PI)  dA -= 2 * Math.PI;
          if (dA < -Math.PI) dA += 2 * Math.PI;
          const targetOmega = (dA / dt) * (180 / Math.PI) * NKP_HELD_SPIN_FACTOR;
          h.smOmega = h.smOmega * NKP_HELD_OMEGA_SMOOTH + targetOmega * (1 - NKP_HELD_OMEGA_SMOOTH);
        }
        h.prevVelAngle = vAngle;
      }
      b.omega = h.smOmega;  // live-preview the wind-up on the body
      h.lastX = p.x; h.lastY = p.y; h.lastTime = now;
    };
    const onUp = () => {
      const h = heldRef.current;
      if (!h) return;
      const b = bodyById(h.bodyId);
      heldRef.current = null;
      if (!b) return;
      b.held = false;
      // Hand off the smoothed samples to the physics loop.
      b.vx = h.smVX; b.vy = h.smVY; b.omega = h.smOmega;
    };
    const arena = arenaRef.current;
    if (arena) {
      arena.addEventListener('mousedown',  onDown);
      arena.addEventListener('touchstart', onDown, { passive: false });
    }
    // Move + up on window so drags survive going outside the arena.
    window.addEventListener('mousemove',  onMove);
    window.addEventListener('mouseup',    onUp);
    window.addEventListener('touchmove',  onMove, { passive: false });
    window.addEventListener('touchend',   onUp);
    return () => {
      if (arena) {
        arena.removeEventListener('mousedown',  onDown);
        arena.removeEventListener('touchstart', onDown);
      }
      window.removeEventListener('mousemove',  onMove);
      window.removeEventListener('mouseup',    onUp);
      window.removeEventListener('touchmove',  onMove);
      window.removeEventListener('touchend',   onUp);
    };
  }, []);

  // Return URL — carry the session hash back so ABSCOND drops the
  // user right where they were on the Scryer (inside the session
  // view), not on the Scryer's empty entry screen. Falls back to a
  // plain scry.html if no hash was in this page's URL.
  const returnUrl = decoded.code
    ? 'scry.html#' + encodeURIComponent(decoded.code)
    : 'scry.html';

  return (
    <div className="nkp-page">
      <a href={returnUrl} className="nkp-abscond">{'<<< ABSCOND.'}</a>
      <div className="nkp-title-row">
        <span className="nkp-title">Scryer Skuffle Park</span>
        <a href="index.html" className="nkp-logo-link"
           title="Back to the Session Scryer homepage">
          <img src="./images/logos/ScryerLogoRegular.png" alt="Session Scryer"/>
        </a>
      </div>
      {!decoded.players.length ? (
        <div className="nkp-empty">
          <p>No session in the URL to bounce around.</p>
          <p style={{marginTop: '10px'}}>
            Go back to the <a href="scry.html">Scryer</a>, load a session,
            and hold <b>S+P+I+N</b> to return here.
          </p>
        </div>
      ) : (
        <div className="nkp-arena"
             ref={arenaRef}
             style={{
               left: arenaX + 'px', top: arenaY + 'px',
               width: arenaW + 'px', height: arenaH + 'px',
               // grab cursor invites the fling interaction; pointer
               // events must reach the arena for hit-testing (glyph
               // wrappers below still keep pointerEvents:none so the
               // arena stays the single event surface).
               cursor: heldRef.current ? 'grabbing' : 'grab',
               touchAction: 'none',
             }}>
          {bodiesRef.current.map(b => (
            <div key={b.id} style={{
              position: 'absolute',
              left: (b.x - b.r) + 'px',
              top:  (b.y - b.r) + 'px',
              width: b.size + 'px', height: b.size + 'px',
              pointerEvents: 'none',
            }}>
              <ClasspectGlyph
                className={b.player.class}
                aspectName={b.player.aspect}
                size={b.size}
                showButtons={false}
                animate={false}
                spinAngle={b.theta}
                frameless
                canonCharacters={[{ lunarsway: b.player.moon }]}
              />
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<NkpApp/>);
</script>
</body>
</html>
